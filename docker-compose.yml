version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: repomind-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - repomind_data:/var/lib/postgresql/data

volumes:
  repomind_data:
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: repomind_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - repomind_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: repomind_cli
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/repomind
    volumes:
      - .:/app
      # Prevents the local host .venv from overwriting the container's isolated .venv
      - /app/.venv 

volumes:
  repomind_data:
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repomind"
version = "0.1.0"
description = "AI-powered repository intelligence tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "GitPython>=3.1.42",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "SQLAlchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
repomind = "repomind.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# Tell pytest to ONLY look in the "tests" directory
testpaths = [
    "tests",
]
# Tell pytest to completely ignore the  cloned repositories
norecursedirs = [
    "repositories",
    ".git",
    ".venv",
    "venv"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
